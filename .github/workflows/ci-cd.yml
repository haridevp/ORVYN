name: AI Pentest CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, closed]

jobs:
  ci:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          pip install -r src/backend/requirements.txt
          pip install pytest

      - name: Run Tests
        run: pytest

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers for Validation
        run: docker compose up -d

      - name: Wait for API
        run: sleep 10

      - name: Health Check
        run: curl --fail http://localhost:8000/health

      - name: Shutdown
        if: always()
        run: docker compose down

  cd:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main After Merge
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build

      - name: Start Containers
        run: docker compose up -d

      - name: Wait for API
        run: sleep 10

      - name: Deployment Health Check
        run: curl --fail http://localhost:8000/health

      - name: Shutdown
        if: always()
        run: docker compose down
