services:
  backend:
    build: ./src/backend
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - redis
      - db

  worker:
    build: ./src/worker
    container_name: celery_worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - redis

  frontend:
    build: ./frontend
    container_name: frontend_app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: redis

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pentest

  # Deliberately-vulnerable app used as a legal, self-contained scan target
  # for local demos - so `/scan/start` has something real to point Nuclei/
  # ZAP/Nikto at without touching any third-party site. Not started by
  # default; run `docker compose --profile demo-target up` to include it.
  demo-target:
    image: bkimminich/juice-shop
    container_name: juice_shop_demo_target
    ports:
      - "3000:3000"
    profiles:
      - demo-target
