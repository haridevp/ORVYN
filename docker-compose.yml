version: "3.9"

services:
  backend:
    build: ./src/backend
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db

  worker:
    build: ./src/worker
    container_name: celery_worker
    depends_on:
      - redis

  redis:
    image: redis:7
    container_name: redis

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pentest

  # ollama:
  #   image: ollama/ollama
  #   container_name: ollama
